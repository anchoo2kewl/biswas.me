version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biswas-me
    restart: unless-stopped
    ports:
      - "3000:3000"  # Next.js frontend
      - "8081:8080"  # Go backend API
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAIL_PROVIDER=brevo
      - FROM_EMAIL=anshuman@biswas.me
      - TO_EMAIL=anshuman@biswas.me
      - DB_PATH=./messages.db
    env_file:
      - backend/.env
    volumes:
      - portfolio-data:/app/backend
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.project=biswas-me"
      - "service=portfolio-website"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  portfolio-data: