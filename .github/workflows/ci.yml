name: CI

on:
  push:
    branches: [main, staging, uat]
  pull_request:
    branches: [main, staging, uat]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            yarn install --frozen-lockfile --network-timeout 60000 && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Create stub config
        run: |
          mkdir -p config
          cat > config/env.config.ts << 'CONF'
          const config = {
            RECAPTCHA_SITE_KEY: "stub",
            API_URL: "/api/messages",
            BLOG_API_URL: "/api/posts",
            BLOG_VIEW_ALL_URL: "https://anshumanbiswas.com",
            BLOG_API_TOKEN: undefined,
          };
          export default config;
          CONF

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            yarn install --frozen-lockfile --network-timeout 60000 && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Create stub config
        run: |
          mkdir -p config
          cat > config/env.config.ts << 'CONF'
          const config = {
            RECAPTCHA_SITE_KEY: "stub",
            API_URL: "/api/messages",
            BLOG_API_URL: "/api/posts",
            BLOG_VIEW_ALL_URL: "https://anshumanbiswas.com",
            BLOG_API_TOKEN: undefined,
          };
          export default config;
          CONF

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 5

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.taskai.cc

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [build, test, security-scan, sonarqube]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "Security scan failed"
            exit 1
          fi
          if [ "${{ needs.sonarqube.result }}" != "success" ] && [ "${{ needs.sonarqube.result }}" != "skipped" ]; then
            echo "SonarQube analysis failed"
            exit 1
          fi
          echo "All checks passed!"
