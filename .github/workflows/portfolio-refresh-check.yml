name: Interactive Portfolio Review

# Temporary work-branch validation. Removed before merging into production.
on:
  push:
    branches: [restore-interactive-portfolio-20261004]
permissions:
  contents: read
concurrency:
  group: interactive-portfolio-review
  cancel-in-progress: false
jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Install PDF generation tools
        run: python3 -m pip install reportlab
      - name: Prepare the requested homepage and hiring updates
        run: python3 .github/prepare-portfolio-refresh.py
      - name: Commit only generated source and resume changes to the working branch
        run: |
          git add app/page.tsx components/project-artwork.tsx components/career-journey.tsx lib/profile.json public/AnshumanBiswas.pdf public/resume.html __tests__/app/page.test.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Restore original artwork and portrait integration; document Veeva and Elastio hiring'
            git push origin HEAD:restore-interactive-portfolio-20261004
          fi
      - name: Configure non-secret test environment
        run: |
          mkdir -p config
          cat > config/env.config.ts <<'CONFIG'
          const config = {
            RECAPTCHA_SITE_KEY: 'stub', API_URL: '/api/messages', BLOG_API_URL: '/api/posts',
            BLOG_VIEW_ALL_URL: 'https://anshumanbiswas.com', BLOG_API_TOKEN: undefined,
          };
          export default config;
          CONFIG
      - name: Unit and component tests
        run: yarn test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: yarn lint
      - name: Production build
        run: yarn build
      - name: Install isolated browser validation tools
        run: |
          npm install --prefix /tmp/portfolio-ui-test playwright pdf-lib
          /tmp/portfolio-ui-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate built site and capture review images
        run: |
          yarn start --port 3017 > /tmp/portfolio-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3017 > /dev/null; then break; fi
            sleep 2
          done
          node .github/check-portfolio.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interactive-portfolio-review
          path: portfolio-review/
          retention-days: 7
