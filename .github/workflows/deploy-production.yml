name: Deploy to Production

on:
  pull_request:
    types: [ closed ]
    branches: [ production ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan biswas.me >> ~/.ssh/known_hosts

          echo "🚀 Deploying to Production server (biswas.me)..."
          echo "Commit: $COMMIT_SHA"

          # Deploy using Docker on production server
          ssh ubuntu@biswas.me bash -s << EOF
            set -e

            # Create deployment directory
            mkdir -p ~/projects/biswas.me
            cd ~/projects/biswas.me

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📦 Pulling latest code..."
              git fetch origin
              git reset --hard $COMMIT_SHA
            else
              echo "📦 Cloning repository..."
              git clone https://github.com/anchoo2kewl/biswas.me.git .
              git checkout $COMMIT_SHA
            fi

            echo "⚙️  Creating Production config file..."
            mkdir -p config
            cat > config/env.config.ts << 'CONFIGEOF'
// Production Environment Configuration
const config = {
  RECAPTCHA_SITE_KEY: "6LcfEZsdAAAAAH6DVoJexNRQRW0J_AL9uxSthwCt",
  API_URL: "http://localhost:8080/api/messages",
  BLOG_API_URL: "http://localhost:8080/api/posts",
  BLOG_VIEW_ALL_URL: "https://anshumanbiswas.com",
};

export default config;
CONFIGEOF

            echo "🔨 Building Docker image..."
            docker build -t biswasme_portfolio:latest .

            echo "🛑 Stopping existing container..."
            docker stop biswas-me || true
            docker rm biswas-me || true

            echo "🚀 Starting new container..."
            docker run -d --name biswas-me \\
              -p 3000:3000 \\
              -p 8081:8080 \\
              --restart unless-stopped \\
              -e BLOG_API_URL=https://anshumanbiswas.com \\
              -e BLOG_API_TOKEN='$BLOG_API_TOKEN' \\
              -e FROM_EMAIL=anshuman@biswas.me \\
              -e TO_EMAIL=anshuman@biswas.me \\
              -e MAIL_PROVIDER=brevo \\
              -e BREVO_API_KEY='$BREVO_API_KEY' \\
              -e MAILPIT_SMTP_HOST=localhost \\
              -e MAILPIT_SMTP_PORT=1025 \\
              -e DB_PATH=./messages.db \\
              -e RECAPTCHA_SECRET_KEY='$RECAPTCHA_SECRET_KEY' \\
              biswasme_portfolio:latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=24h"

            echo "✅ Deployment complete!"
            docker ps --filter "name=biswas-me" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 10

          echo "🔍 Testing Production endpoint..."
          curl -f https://biswas.me || {
            echo "❌ Health check failed"
            exit 1
          }

          echo "✅ Health check passed"

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** biswas.me" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://biswas.me" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API: https://biswas.me:8081" >> $GITHUB_STEP_SUMMARY
          echo "- Pulls blog posts from: https://anshumanbiswas.com" >> $GITHUB_STEP_SUMMARY
