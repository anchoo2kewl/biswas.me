name: Verify Live Portfolio

# Temporary read-only verification of the requested production release.
on:
  push:
    branches: [resume-portfolio-refresh-20261003]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live pages and PDF against the released artifact
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request
          BASE = 'https://biswas.me'
          RELEASE = 'becbb9d10fb54180bfa6300d064513a010bd3957'
          EXPECTED_PDF_BLOB = 'ac755d67c33c8f0a8924bf0ba0d89d9e0185855b'
          paths = {
              '/': ['I lead engineering.', 'https://lifeai.cc', 'patent-pending'],
              '/resume': ['~40 engineers', '~70 engineers', 'LifeAI', 'multiple paying customers'],
              '/resume.html': ['~40 engineers', '~70 engineers', 'LifeAI', 'multiple paying customers'],
          }
          for path, expected in paths.items():
              for attempt in range(8):
                  request = urllib.request.Request(BASE + path + '?release=' + RELEASE, headers={'Cache-Control': 'no-cache', 'User-Agent': 'PortfolioReleaseVerification/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      assert response.status == 200
                      text = response.read().decode('utf-8')
                  if all(value.lower() in text.lower() for value in expected):
                      print('PASS live content:', path)
                      break
                  if attempt == 7:
                      raise AssertionError('Expected release content not served: ' + path)
                  time.sleep(10)
          request = urllib.request.Request(BASE + '/AnshumanBiswas.pdf?release=' + RELEASE, headers={'Cache-Control': 'no-cache', 'User-Agent': 'PortfolioReleaseVerification/1.0'})
          with urllib.request.urlopen(request, timeout=20) as response:
              assert response.status == 200
              data = response.read()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == EXPECTED_PDF_BLOB, f'Live PDF differs from tested artifact: {digest}'
          print('PASS live PDF: exact match to the validated one-page artifact', digest)
          print('PRODUCTION RELEASE VERIFIED:', RELEASE)
          PY
