name: Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if vulnerabilities found
          ignore-unfixed: true

  deploy-staging:
    needs: security-scan  # Only deploy if security scan passes
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan 129.213.82.37 >> ~/.ssh/known_hosts

          echo "🚀 Deploying to Staging server..."
          echo "Commit: $COMMIT_SHA"

          # Deploy directly via SSH
          ssh -i ~/.ssh/deploy_key ubuntu@129.213.82.37 bash -s <<EOF
            set -e

            # Create deployment directory
            mkdir -p ~/biswas-me-staging
            cd ~/biswas-me-staging

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📦 Pulling latest code..."
              git fetch origin
              git reset --hard $COMMIT_SHA
            else
              echo "📦 Cloning repository..."
              git clone https://github.com/anchoo2kewl/biswas.me.git .
              git checkout $COMMIT_SHA
            fi

            echo "⚙️  Creating Staging config file..."
            mkdir -p config
            printf '%s\n' \
              '// Staging Environment Configuration' \
              'const config = {' \
              '  RECAPTCHA_SITE_KEY: "6LcfEZsdAAAAAH6DVoJexNRQRW0J_AL9uxSthwCt",' \
              '  API_URL: "/api/messages",' \
              '  BLOG_API_URL: "/api/posts",' \
              '  BLOG_VIEW_ALL_URL: "https://staging.anshumanbiswas.com",' \
              '  BLOG_API_TOKEN: undefined,' \
              '};' \
              'export default config;' \
              > config/env.config.ts

            echo "🧹 Cleaning up Docker build cache and unused images to free disk space..."
            docker builder prune -af || true
            docker image prune -af || true

            echo "🔨 Building Docker image..."
            docker build -t biswas-me-staging:$COMMIT_SHA -t biswas-me-staging:latest .

            echo "🛑 Stopping existing containers..."
            docker rm -f biswas-me-staging 2>/dev/null || true
            sleep 2

            echo "🚀 Starting new container..."
            docker run -d --name biswas-me-staging \\
              -p 3001:3000 \\
              -p 8082:8080 \\
              --restart unless-stopped \\
              -e BLOG_API_URL='https://staging.anshumanbiswas.com' \\
              -e BLOG_API_TOKEN='$BLOG_API_TOKEN' \\
              -e CF_ACCESS_CLIENT_ID='$CF_ACCESS_CLIENT_ID' \\
              -e CF_ACCESS_CLIENT_SECRET='$CF_ACCESS_CLIENT_SECRET' \\
              -e FROM_EMAIL=anshuman@biswas.me \\
              -e TO_EMAIL=anshuman@biswas.me \\
              -e MAIL_PROVIDER=brevo \\
              -e BREVO_API_KEY='$BREVO_API_KEY' \\
              -e MAILPIT_SMTP_HOST=localhost \\
              -e MAILPIT_SMTP_PORT=1025 \\
              -e DB_PATH=./messages.db \\
              -e RECAPTCHA_SECRET_KEY='$RECAPTCHA_SECRET_KEY' \\
              biswas-me-staging:latest

            echo "✅ Container deployment complete!"
            docker ps --filter "name=biswas-me-staging" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # Setup nginx + SSL
            echo "🔐 Setting up nginx + SSL..."
            chmod +x scripts/setup-cloudflare-ssl.sh scripts/setup-nginx-staging.sh
            if [ ! -z "$CF_API_TOKEN" ]; then
              sudo CF_API_TOKEN='$CF_API_TOKEN' ./scripts/setup-cloudflare-ssl.sh staging.biswas.me
            fi
            sudo ./scripts/setup-nginx-staging.sh
            sudo systemctl reload nginx
            echo "✅ Nginx + SSL setup complete!"
          EOF

      - name: Verify deployment
        continue-on-error: true
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 30

          echo "🔍 Testing Staging endpoint..."
          curl -f --connect-timeout 30 --max-time 60 -H "Host: staging.biswas.me" http://129.213.82.37 || {
            echo "⚠️  Health check failed (non-blocking)"
            exit 0
          }

          echo "✅ Health check passed"

      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** 129.213.82.37" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain:** staging.biswas.me" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://129.213.82.37:3001" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://129.213.82.37:8082" >> $GITHUB_STEP_SUMMARY
          echo "- Public: https://staging.biswas.me (via Cloudflare)" >> $GITHUB_STEP_SUMMARY
