name: Deploy to Staging

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 129.213.82.37 >> ~/.ssh/known_hosts

          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOYSCRIPT'
          set -e
          COMMIT_SHA="$1"
          BLOG_API_TOKEN="$2"
          BREVO_API_KEY="$3"
          RECAPTCHA_SECRET_KEY="$4"

          mkdir -p ~/biswas-me-staging
          cd ~/biswas-me-staging

          if [ -d ".git" ]; then
            git fetch origin
            git reset --hard "$COMMIT_SHA"
          else
            git clone https://github.com/anchoo2kewl/biswas.me.git .
            git checkout "$COMMIT_SHA"
          fi

          mkdir -p config
          cat > config/env.config.ts << 'CONFIGEND'
          const config = {
            RECAPTCHA_SITE_KEY: "6LcfEZsdAAAAAH6DVoJexNRQRW0J_AL9uxSthwCt",
            API_URL: "http://localhost:8080/api/messages",
            BLOG_API_URL: "http://localhost:8080/api/posts",
            BLOG_VIEW_ALL_URL: "https://staging.anshumanbiswas.com",
          };
          export default config;
          CONFIGEND

          docker build -t biswas-me-staging:latest .
          docker stop biswas-me-staging 2>/dev/null || true
          docker rm biswas-me-staging 2>/dev/null || true

          docker run -d --name biswas-me-staging \
            -p 3001:3000 \
            -p 8082:8080 \
            --restart unless-stopped \
            -e BLOG_API_URL=https://staging.anshumanbiswas.com \
            -e BLOG_API_TOKEN="$BLOG_API_TOKEN" \
            -e FROM_EMAIL=anshuman@biswas.me \
            -e TO_EMAIL=anshuman@biswas.me \
            -e MAIL_PROVIDER=brevo \
            -e BREVO_API_KEY="$BREVO_API_KEY" \
            -e MAILPIT_SMTP_HOST=localhost \
            -e MAILPIT_SMTP_PORT=1025 \
            -e DB_PATH=./messages.db \
            -e RECAPTCHA_SECRET_KEY="$RECAPTCHA_SECRET_KEY" \
            biswas-me-staging:latest

          docker image prune -f --filter "until=24h"
          docker ps --filter "name=biswas-me-staging"
          DEPLOYSCRIPT

          # Copy and execute deployment script
          scp -i ~/.ssh/id_rsa /tmp/deploy.sh ubuntu@129.213.82.37:/tmp/deploy-biswas-staging.sh
          ssh -i ~/.ssh/id_rsa ubuntu@129.213.82.37 "bash /tmp/deploy-biswas-staging.sh '$COMMIT_SHA' '$BLOG_API_TOKEN' '$BREVO_API_KEY' '$RECAPTCHA_SECRET_KEY'"

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://129.213.82.37:3001 || exit 1
