name: Deploy to Production

on:
  push:
    branches: [ production ]  # Only production branch, NOT master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if vulnerabilities found
          ignore-unfixed: true

  deploy-production:
    needs: security-scan  # Only deploy if security scan passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan 31.97.102.48 >> ~/.ssh/known_hosts

          echo "🚀 Deploying to Production server..."
          echo "Commit: $COMMIT_SHA"

          # Deploy directly via SSH
          ssh -i ~/.ssh/deploy_key ubuntu@31.97.102.48 bash -s <<EOF
            set -e

            # Create deployment directory
            mkdir -p ~/biswas-me-production
            cd ~/biswas-me-production

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📦 Pulling latest code..."
              git fetch origin
              git reset --hard $COMMIT_SHA
            else
              echo "📦 Cloning repository..."
              git clone https://github.com/anchoo2kewl/biswas.me.git .
              git checkout $COMMIT_SHA
            fi

            echo "⚙️  Creating Production config file..."
            mkdir -p config
            printf '%s\n' \
              '// Production Environment Configuration' \
              'const config = {' \
              '  RECAPTCHA_SITE_KEY: "6LcfEZsdAAAAAH6DVoJexNRQRW0J_AL9uxSthwCt",' \
              '  API_URL: "/api/messages",' \
              '  BLOG_API_URL: "/api/posts",' \
              '  BLOG_VIEW_ALL_URL: "https://anshumanbiswas.com",' \
              '  BLOG_API_TOKEN: undefined,' \
              '};' \
              'export default config;' \
              > config/env.config.ts

            echo "🔨 Building Docker image..."
            docker build -t biswas-me-production:$COMMIT_SHA -t biswas-me-production:latest .

            echo "🛑 Stopping existing container..."
            docker rm -f biswas-me 2>/dev/null || true
            sleep 2

            echo "🚀 Starting new container..."
            docker run -d --name biswas-me \\
              -p 3000:3000 \\
              -p 8081:8080 \\
              --restart unless-stopped \\
              -e BLOG_API_URL='https://anshumanbiswas.com' \\
              -e BLOG_API_TOKEN='productionSecretToken456' \\
              -e FROM_EMAIL=anshuman@biswas.me \\
              -e TO_EMAIL=anshuman@biswas.me \\
              -e MAIL_PROVIDER=brevo \\
              -e BREVO_API_KEY='$BREVO_API_KEY' \\
              -e MAILPIT_SMTP_HOST=localhost \\
              -e MAILPIT_SMTP_PORT=1025 \\
              -e DB_PATH=./messages.db \\
              -e RECAPTCHA_SECRET_KEY='$RECAPTCHA_SECRET_KEY' \\
              biswas-me-production:latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=24h"

            echo "✅ Deployment complete!"
            docker ps --filter "name=biswas-me" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verify deployment
        continue-on-error: true
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 30

          echo "🔍 Testing Production endpoint..."
          curl -f --connect-timeout 30 --max-time 60 http://31.97.102.48:3000 || {
            echo "⚠️  Health check failed (non-blocking)"
            exit 0
          }

          echo "✅ Health check passed"

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** 31.97.102.48" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access:**" >> $GITHUB_STEP_SUMMARY
          echo "- Direct: http://31.97.102.48:3000" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://31.97.102.48:8081" >> $GITHUB_STEP_SUMMARY
