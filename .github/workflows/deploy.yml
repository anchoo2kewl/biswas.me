name: Build and Deploy biswas.me

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env.config.ts
        run: cp config/env.config.sample.ts config/env.config.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.clean
          push: true
          tags: ghcr.io/${{ github.repository }}/biswas-me:latest

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan biswas.me >> ~/.ssh/known_hosts
          
          ssh ubuntu@biswas.me "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && docker pull ghcr.io/${{ github.repository }}/biswas-me:latest && docker stop biswas-me || true && docker rm biswas-me || true && docker run -d --name biswas-me -p 3000:3000 -p 8081:8080 --restart unless-stopped -e BLOG_API_URL=https://anshumanbiswas.com -e BLOG_API_TOKEN=$BLOG_API_TOKEN -e FROM_EMAIL=anshuman@biswas.me -e TO_EMAIL=anshuman@biswas.me -e MAIL_PROVIDER=brevo -e BREVO_API_KEY=$BREVO_API_KEY -e MAILPIT_SMTP_HOST=localhost -e MAILPIT_SMTP_PORT=1025 -e DB_PATH=./messages.db -e RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY ghcr.io/${{ github.repository }}/biswas-me:latest && docker image prune -f"
