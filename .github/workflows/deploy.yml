name: Deploy to Production

on:
  push:
    branches: [ production, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy clean Mac-built image to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 31.97.102.48 >> ~/.ssh/known_hosts

          echo "🚀 Deploying to Production server (31.97.102.48)..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

          # Deploy using existing Mac-clean image on server
          # Pass environment variables through SSH
          ssh ubuntu@31.97.102.48 bash -s << EOF
            cd ~/projects/biswas.me
            docker stop biswas-me || true
            docker rm biswas-me || true
            docker run -d --name biswas-me \
              -p 3000:3000 \
              -p 8081:8080 \
              --restart unless-stopped \
              -e BLOG_API_URL=https://anshumanbiswas.com \
              -e BLOG_API_TOKEN='${BLOG_API_TOKEN}' \
              -e FROM_EMAIL=anshuman@biswas.me \
              -e TO_EMAIL=anshuman@biswas.me \
              -e MAIL_PROVIDER=brevo \
              -e BREVO_API_KEY='${BREVO_API_KEY}' \
              -e MAILPIT_SMTP_HOST=localhost \
              -e MAILPIT_SMTP_PORT=1025 \
              -e DB_PATH=./messages.db \
              -e RECAPTCHA_SECRET_KEY='${RECAPTCHA_SECRET_KEY}' \
              biswasme_portfolio:mac-clean
          EOF
