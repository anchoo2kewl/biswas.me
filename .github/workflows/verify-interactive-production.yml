name: Verify Interactive Production

# Temporary read-only check of the explicitly requested production release.
on:
  push:
    branches: [restore-interactive-portfolio-20261004]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public pages and exact PDF artifact
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import time
          import urllib.request
          from html.parser import HTMLParser

          RELEASE = 'cde48518153f799a5afc79f1a11354ae1cda898b'
          PDF_SHA256 = '988947b619adb243f8df6ee55171ce3ac3e833e7b7ceeee5e7542301af46755e'
          BASE = 'https://biswas.me'

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'noscript'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'noscript'):
                      self.skip = max(0, self.skip - 1)
              def handle_data(self, text):
                  if not self.skip:
                      self.parts.append(text)

          def get(path):
              req = urllib.request.Request(BASE + path + '?release=' + RELEASE, headers={
                  'Cache-Control': 'no-cache', 'User-Agent': 'PortfolioReleaseVerification/1.0'
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read()

          for attempt in range(24):
              try:
                  html = get('/').decode('utf-8')
                  parser = VisibleText(); parser.feed(html)
                  text = re.sub(r'\s+', ' ', ' '.join(parser.parts))
                  assert 'Now shipping' in text
                  assert 'Built the engineering team from scratch' in text
                  assert 'Explore this chapter' in text
                  assert 'LifeAI' in text
                  assert 'p-builder' in html and 't-list' in html
                  assert 'p-leadership' not in html
                  assert not re.search(r'~(?:15|40|70)', text), 'Unexpected homepage headcount'
                  for path in ('/resume', '/resume.html'):
                      doc = get(path).decode('utf-8')
                      parser = VisibleText(); parser.feed(doc)
                      resume = re.sub(r'\s+', ' ', ' '.join(parser.parts))
                      assert 'from scratch, hiring' in resume, path
                      assert 'hire and develop teams' in resume, path
                      assert '~40 engineers' in resume and '~70 engineers' in resume, path
                      assert 'LifeAI' in resume, path
                  assert hashlib.sha256(get('/AnshumanBiswas.pdf')).hexdigest() == PDF_SHA256
                  print('PASS: Live homepage restores the portrait and interactive timeline, without displayed headcounts.')
                  print('PASS: Live PDF/HTML resume includes Veeva team-building and Elastio hiring.')
                  print('PASS: Live PDF exactly matches the visually inspected, one-page artifact: ' + PDF_SHA256)
                  print('PRODUCTION VERIFIED: ' + RELEASE)
                  break
              except Exception as error:
                  if attempt == 23:
                      raise
                  print('Waiting for the production release:', type(error).__name__, str(error))
                  time.sleep(12)
          PY
