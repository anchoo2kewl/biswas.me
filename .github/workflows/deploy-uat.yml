name: Deploy to UAT

on:
  push:
    branches: [ uat, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if vulnerabilities found
          ignore-unfixed: true

  deploy-uat:
    needs: security-scan  # Only deploy if security scan passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to UAT server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 92.4.83.28 >> ~/.ssh/known_hosts

          echo "🚀 Deploying to UAT server..."
          echo "Commit: $COMMIT_SHA"

          # Deploy to UAT server - build natively on ARM64
          ssh ubuntu@92.4.83.28 "bash -s" << EOF
            set -e

            # Create deployment directory
            mkdir -p ~/biswas-me-uat
            cd ~/biswas-me-uat

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📦 Pulling latest code..."
              git fetch origin
              git reset --hard $COMMIT_SHA
            else
              echo "📦 Cloning repository..."
              git clone https://github.com/anchoo2kewl/biswas.me.git .
              git checkout $COMMIT_SHA
            fi

            echo "⚙️  Creating UAT config file..."
            mkdir -p config
            echo '// UAT Environment Configuration' > config/env.config.ts
            echo 'const config = {' >> config/env.config.ts
            echo '  RECAPTCHA_SITE_KEY: "6LcfEZsdAAAAAH6DVoJexNRQRW0J_AL9uxSthwCt",' >> config/env.config.ts
            echo '  API_URL: "http://localhost:8080/api/messages",' >> config/env.config.ts
            echo '  BLOG_API_URL: "http://localhost:8080/api/posts",' >> config/env.config.ts
            echo '  BLOG_VIEW_ALL_URL: "https://anshumanbiswas.com",' >> config/env.config.ts
            echo '};' >> config/env.config.ts
            echo '' >> config/env.config.ts
            echo 'export default config;' >> config/env.config.ts

            echo "🔨 Building Docker image (native ARM64)..."
            docker build -t biswas-me-uat:$COMMIT_SHA -t biswas-me-uat:latest .

            echo "🛑 Stopping existing container..."
            docker stop biswas-me-uat || true
            docker rm biswas-me-uat || true

            echo "🚀 Starting new container..."
            docker run -d --name biswas-me-uat \\
              -p 3000:3000 \\
              -p 8080:8080 \\
              --restart unless-stopped \\
              -e BLOG_API_URL=https://anshumanbiswas.com \\
              -e BLOG_API_TOKEN='$BLOG_API_TOKEN' \\
              -e FROM_EMAIL=anshuman@biswas.me \\
              -e TO_EMAIL=anshuman@biswas.me \\
              -e MAIL_PROVIDER=brevo \\
              -e BREVO_API_KEY='$BREVO_API_KEY' \\
              -e MAILPIT_SMTP_HOST=localhost \\
              -e MAILPIT_SMTP_PORT=1025 \\
              -e DB_PATH=./messages.db \\
              -e RECAPTCHA_SECRET_KEY='$RECAPTCHA_SECRET_KEY' \\
              biswas-me-uat:latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=24h"

            echo "✅ Deployment complete!"
            docker ps --filter "name=biswas-me-uat" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 10

          echo "🔍 Testing UAT endpoint..."
          curl -f http://92.4.83.28:3000 || {
            echo "❌ Health check failed"
            exit 1
          }

          echo "✅ Health check passed"

      - name: Deployment summary
        run: |
          echo "## 🚀 UAT Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** 92.4.83.28" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** Native ARM64 (built on server)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://92.4.83.28:3000" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://92.4.83.28:8080" >> $GITHUB_STEP_SUMMARY
