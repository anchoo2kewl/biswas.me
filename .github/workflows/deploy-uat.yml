name: Deploy to UAT

on:
  push:
    branches: [ uat, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=uat-latest,enable=${{ github.ref == 'refs/heads/uat' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Deploy to UAT server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 92.4.83.28 >> ~/.ssh/known_hosts

          # Get the first tag (should be the branch name or uat-latest)
          IMAGE=$(echo "$IMAGE_TAG" | head -n1)

          echo "Deploying image: $IMAGE"

          # Deploy to UAT server
          ssh ubuntu@92.4.83.28 bash -s << 'ENDSSH'
            set -e

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker pull $IMAGE

            # Stop and remove existing container
            docker stop biswas-me-uat || true
            docker rm biswas-me-uat || true

            # Run new container
            docker run -d --name biswas-me-uat \
              -p 3000:3000 \
              -p 8080:8080 \
              --restart unless-stopped \
              -e BLOG_API_URL=https://anshumanbiswas.com \
              -e BLOG_API_TOKEN='${BLOG_API_TOKEN}' \
              -e FROM_EMAIL=anshuman@biswas.me \
              -e TO_EMAIL=anshuman@biswas.me \
              -e MAIL_PROVIDER=brevo \
              -e BREVO_API_KEY='${BREVO_API_KEY}' \
              -e MAILPIT_SMTP_HOST=localhost \
              -e MAILPIT_SMTP_PORT=1025 \
              -e DB_PATH=./messages.db \
              -e RECAPTCHA_SECRET_KEY='${RECAPTCHA_SECRET_KEY}' \
              $IMAGE

            # Verify container is running
            docker ps | grep biswas-me-uat

            echo "✅ UAT deployment complete!"
          ENDSSH

      - name: Deployment summary
        run: |
          echo "## 🚀 UAT Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** 92.4.83.28" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Access at: http://92.4.83.28" >> $GITHUB_STEP_SUMMARY
