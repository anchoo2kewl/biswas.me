<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshuman Biswas - Academic Profile</title>
    <link rel="shortcut icon" href="academic/favicon-tr.ico" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 300px;
            height: auto;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        p {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,123,255,0.3);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="academic/images/sce.png" alt="Carleton University - Systems and Computer Engineering" />
        </div>
        
        <h1>Anshuman Biswas</h1>
        <p>Welcome to my academic profile. I'm a Ph.D. graduate from Carleton University with research in cloud middleware performance optimization using machine learning techniques.</p>
        
        <a href="academic/" class="btn">View Academic Profile</a>
        <a href="https://biswas.me" class="btn btn-secondary">Professional Website</a>
    </div>
    
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function() {
            window.location.href = 'academic/';
        }, 3000);
    </script>
</body>
</html>
