# SonarQube Configuration for biswas.me
# Project Information
sonar.projectKey=biswas.me
sonar.projectName=biswas.me Portfolio
sonar.projectVersion=1.0

# Source code location
sonar.sources=app,components,lib,backend
sonar.tests=__tests__,backend/tests

# File inclusions/exclusions
sonar.exclusions=node_modules/**,\
  .next/**,\
  out/**,\
  public/**,\
  *.config.js,\
  *.config.ts,\
  *.config.mjs,\
  coverage/**,\
  build/**,\
  dist/**,\
  backend/vendor/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.spec.js

# Test exclusions (don't count test files in coverage)
sonar.test.inclusions=**/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.spec.js

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Go backend settings
sonar.go.coverage.reportPaths=backend/coverage.out

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage settings
sonar.coverage.exclusions=**/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.spec.js,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs

# Quality Gate
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300

# Additional settings
sonar.scm.provider=git
